version: '3.8'

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: proovy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-proovy}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-proovy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Proovy AI Service
  proovy-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proovy-ai
    restart: unless-stopped
    environment:
      - PGVECTOR_DSN=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:${DB_PORT:-5432}/${DB_NAME:-proovy}
      - RAG_VECTORSTORE=pgvector
      - HOST=0.0.0.0
      - PORT=8081
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
